  from = "/blog/index"
  to = "https://suprabhat-dev.com/blog/"
  status = 301
  force = true

# Files that still answered 200 because the catch-all below is not forced.
# The resume PDF and the portrait were indexed under this old domain, and the
# include partials are HTML fragments a crawler can treat as thin pages, so
# each is forced onto its match on the new site.
[[redirects]]
  from = "/assets/suprabhat-kumar-resume.pdf"
  to = "https://suprabhat-dev.com/about/"
  status = 301
  force = true

# Same photo on the new site, so image search moves it instead of losing it.
[[redirects]]
  from = "/assets/images/suprabhat.webp"
  to = "https://suprabhat-dev.com/assets/images/suprabhat.webp"
  status = 301
  force = true

[[redirects]]
  from = "/assets/images/og-image.svg"
  to = "https://suprabhat-dev.com/assets/images/og-image.jpg"
  status = 301
  force = true

[[redirects]]
  from = "/includes/*"
  to = "https://suprabhat-dev.com/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/COMPONENT_TEMPLATE.html"
  to = "https://suprabhat-dev.com/blog/"
  status = 301
  force = true

# Netlify also serves the page without ".html", and Google indexed that form.
[[redirects]]
  from = "/blog/COMPONENT_TEMPLATE"
  to = "https://suprabhat-dev.com/blog/"
  status = 301
  force = true

# Anything else under /blog/ (including the unused template and any future
# stray path) goes to the blog index. Must stay after the specific rules above.
[[redirects]]
  from = "/blog/*"
  to = "https://suprabhat-dev.com/blog/"
  status = 301
  force = true

# Everything else not matched above (old asset URLs, the unused component
# template, include partials) falls back to the new homepage.
[[redirects]]
  from = "/*"
  to = "https://suprabhat-dev.com/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://api.emailjs.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self';"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
