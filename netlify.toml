# Feeds: send any crawler still polling the old URLs to the live ones.
[[redirects]]
  from = "/sitemap.xml"
  to = "https://suprabhat-dev.com/sitemap-index.xml"
  status = 301
  force = true

[[redirects]]
  from = "/rss.xml"
  to = "https://suprabhat-dev.com/rss.xml"
  status = 301
  force = true

# Everything else not matched above (old asset URLs, the unused component
# template, include partials) falls back to the new homepage.
[[redirects]]
  from = "/*"
  to = "https://suprabhat-dev.com/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://api.emailjs.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self';"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
