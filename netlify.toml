[build]
  publish = "."
  command = ""

# This site has moved to https://suprabhat-dev.com. Every real page 301s to
# its closest match there, so link equity and search rankings transfer
# instead of resetting. Google Search Console's "Change of address" tool
# (run once from the old suprabhat-portfolio.netlify.app property) is what
# actually merges the two entities; these redirects are what makes that
# merge correct page-by-page instead of flattening everything to the
# homepage. See MIGRATION.md for the full mapping and the one-time GSC step.
#
# Verification files (google*.html, BingSiteAuth.xml) and robots.txt are
# left unmatched on purpose: they still need to serve so Search Console
# access to the old property keeps working while Change of address runs.

[[redirects]]
  from = "/"
  to = "https://suprabhat-dev.com/"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "https://suprabhat-dev.com/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/"
  to = "https://suprabhat-dev.com/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/blog.html"
  to = "https://suprabhat-dev.com/blog/"
  status = 301
  force = true

# Same article kept on the new site under the same slug.
